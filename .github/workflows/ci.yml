name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: abio
          POSTGRES_PASSWORD: abio
          POSTGRES_DB: abio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abio -d abio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      HOST: 0.0.0.0
      PORT: 5000
      BACKEND_URL: http://localhost:5000
      CLIENT_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      COOKIE_DOMAIN: localhost
      JWT_SECRET: ci-test-jwt-secret-do-not-use-in-production-32chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      JWT_COOKIE_EXPIRES_IN: 7
      DATABASE_URL: postgresql://abio:abio@localhost:5432/abio_test
      TEST_DATABASE_URL: postgresql://abio:abio@localhost:5432/abio_test
      REDIS_URL: redis://127.0.0.1:6379
      EMAIL_FROM_NAME: Abio CI
      EMAIL_FROM: ci@abio.local
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USERNAME: ci
      SMTP_PASSWORD: ci
      CLOUDINARY_CLOUD_NAME: ci
      CLOUDINARY_API_KEY: ci
      CLOUDINARY_API_SECRET: ci
      GOOGLE_OAUTH_CLIENT_ID: ci-google-client-id
      GOOGLE_OAUTH_CLIENT_SECRET: ci-google-client-secret
      GOOGLE_OAUTH_PROJECT_ID: ci-google-project
      GOOGLE_OAUTH_CALLBACK_URL: http://localhost:5000/api/v1/auth/google/callback
      TOTP_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      LOG_LEVEL: error

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
